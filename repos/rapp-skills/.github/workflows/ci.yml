name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (round-trip, standard conformance, drift)
        run: python -m unittest -v tests/test_rapp_skills.py
      - name: Generated files are current
        run: python rapp_skills.py sync --check
      - name: Shipped skills check clean
        shell: bash
        run: python rapp_skills.py check skills/*
      - name: Nothing is lost there and back
        run: |
          python rapp_skills.py prove tests/fixtures/hello_world_agent.py
          python rapp_skills.py prove tests/fixtures/writing-brief
