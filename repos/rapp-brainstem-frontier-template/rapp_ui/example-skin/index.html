<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Example Skin</title>
<style>
  /* The whole point: this page IS the theme. Restyle anything — the factory
     chat underneath is untouched and one click away. */
  :root { --bg:#07120b; --panel:#0c1f13; --line:#1d4028; --ink:#d8ffe8; --acc:#3fb950; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; height:100vh }
  header { padding:12px 18px; border-bottom:1px solid var(--line); font-weight:700; letter-spacing:.06em }
  header small { color:var(--acc); font-weight:400; margin-left:8px }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px }
  .msg { max-width:72ch; padding:10px 14px; border-radius:12px; background:var(--panel);
         border:1px solid var(--line); white-space:pre-wrap }
  .msg.you { align-self:flex-end; border-color:var(--acc) }
  form { display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line) }
  input { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px;
          color:var(--ink); padding:10px 14px; font:inherit }
  button { background:var(--acc); color:#04140a; border:0; border-radius:10px;
           padding:10px 18px; font-weight:700; cursor:pointer }
</style>
</head>
<body>
<header>EXAMPLE SKIN <small>same brainstem, your theme — close the overlay to revert</small></header>
<div id="log"></div>
<form id="f">
  <input id="q" placeholder="Ask the same brainstem, through your own UI..." autocomplete="off">
  <button>Send</button>
</form>
<script>
"use strict";
// Served same-origin by the kernel at /rapp_ui/<skin-id>/, so the factory
// chat's endpoints are OUR endpoints: the skin changes the face, not the brain.
const log = document.getElementById("log");
let sessionId = null;
function say(text, you) {
  const d = document.createElement("div");
  d.className = "msg" + (you ? " you" : "");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("q");
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  say(text, true);
  try {
    const body = { user_input: text };
    if (sessionId) body.session_id = sessionId;
    const r = await fetch("../../chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    sessionId = d.session_id || sessionId;
    say(d.response || d.error || "(no response)");
  } catch (err) {
    say("The kernel did not answer: " + err.message);
  }
});
say("This is a rapplication skin — the factory grail chat is untouched underneath.");
</script>
</body>
</html>
