name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_manifest.py --check
      - run: python tools/validate_plugin_manifests.py
      - run: python tools/verify_frames.py
      - run: bash -n scripts/bootstrap.sh
      - run: if command -v shellcheck >/dev/null 2>&1; then shellcheck scripts/bootstrap.sh; fi
      - run: python -m pytest -q

  windows-hash-and-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: pwsh
        run: |
          git config core.autocrlf true
          git checkout --force HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_manifest.py --check
      - run: python tools/validate_plugin_manifests.py
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/bootstrap.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: >-
          python -m pytest -q
          tests/test_brainstem_operator.py::test_generated_bootstraps_are_local_and_python_free_before_installer
          tests/test_brainstem_operator.py::test_hash_bound_artifacts_are_lf_normalized_even_with_crlf_input
          tests/test_brainstem_operator.py::test_marketplace_manifests_are_shared_and_plugin_manifests_match
