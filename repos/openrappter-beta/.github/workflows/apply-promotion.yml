name: Apply next ordered promotion request
on:
  workflow_dispatch:
    inputs:
      request_sequence:
        required: false
        type: string
        default: '0'
  schedule: [{ cron: '31 * * * *' }]
permissions: { contents: read }
concurrency: { group: apply-beta, cancel-in-progress: false }
jobs:
  apply:
    permissions: { contents: write }
    uses: kody-w/openrappter-release-train/.github/workflows/apply-request.yml@813eafd957982e2c64d318caa12be3e494a1c7e4
    with:
      requested_sequence: ${{ inputs.request_sequence || '0' }}
      target_ring: beta
      target_repository: kody-w/openrappter-beta
