name: Build RAPP static Dataverse

# Rebuilds the OOTB Dataverse digital twin (rapp-static-api/1.0) on seed change.
# Idempotent + stable-write, so it only commits real changes.

on:
  push:
    paths:
      - 'dataverse/seed/**'
      - 'dataverse/build.py'
      - 'dataverse/manifest.json'
      - '.github/workflows/dataverse.yml'
  schedule:
    - cron: '7 5 * * *'   # daily self-heal (staggered; push-main runs one at a time)
  workflow_dispatch:

permissions:
  contents: write

# rapp-static-api/1.1: every workflow that pushes to main shares ONE concurrency group so pushes never
# race. GitHub keeps at most one pending run per group (a newer one replaces it); each run rebuilds from
# scratch and rebases onto the live tip before pushing, so a replaced run loses nothing.
concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the twin
        run: python dataverse/build.py
      - name: Commit only real changes
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        run: |
          git config user.name "RAPP Twin Bot"
          git config user.email "rapp-bot@users.noreply.github.com"
          git add dataverse/api dataverse/registry.json
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild static Dataverse twin [skip ci]"
          # checkout pins the triggering SHA; rebase onto the live tip before pushing (retry on a race).
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
