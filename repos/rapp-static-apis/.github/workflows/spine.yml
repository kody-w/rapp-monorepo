name: Build root discovery spine

# Regenerates the root index-of-indexes (rapp-god-registry/1.0) + agent-discovery
# surfaces whenever any sub-API's index changes, on a daily schedule (so adding or
# removing a sub-API directory self-heals the index), or on demand. build.py is
# idempotent + stable-write, so this only ever commits real changes.

on:
  push:
    branches: [main]
    paths:
      - '**/registry.json'
      - '**/manifest.json'
      - '**/catalog.json'
      - 'api/rapp-work/schemas/**'
      - 'scripts/generate_rapp_work_api.py'
      - 'build.py'
      - '.github/workflows/spine.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# rapp-static-api/1.1: every workflow that pushes to main shares ONE concurrency group so pushes never
# race. GitHub keeps at most one pending run per group (a newer one replaces it); each run rebuilds from
# scratch and rebases onto the live tip before pushing, so a replaced run loses nothing.
concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the root discovery spine
        run: python build.py
      - name: Score conformance (non-blocking)
        run: python check.py || true
      - name: Commit only real changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "RAPP Spine Bot"
          git config user.email "rapp-bot@users.noreply.github.com"
          git add registry.json api llms.txt sitemap.xml .well-known
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild root discovery spine [skip ci]"
          # checkout pins the triggering SHA; rebase onto the live tip before pushing (retry on a race).
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
