name: Check RAPP Work static API

on:
  pull_request:
    paths:
      - 'api/rapp-work/**'
      - 'scripts/generate_rapp_work_api.py'
      - 'scripts/check_rapp_work_api.py'
      - 'tests/test_rapp_work_api.py'
      - 'tests/fixtures/rapp-work/**'
      - 'build.py'
      - 'check.py'
      - 'registry.json'
      - 'llms.txt'
      - 'sitemap.xml'
      - '.well-known/**'
      - '.github/workflows/rapp-work-static-api.yml'
      - 'template/**'
      - 'tests/test_static_api_11.py'
      - 'tests/fixtures/github/**'
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
  push:
    branches: [main]
    paths:
      - 'api/rapp-work/**'
      - 'scripts/generate_rapp_work_api.py'
      - 'scripts/check_rapp_work_api.py'
      - 'tests/test_rapp_work_api.py'
      - 'tests/fixtures/rapp-work/**'
      - 'build.py'
      - 'check.py'
      - 'registry.json'
      - 'llms.txt'
      - 'sitemap.xml'
      - '.well-known/**'
      - '.github/workflows/rapp-work-static-api.yml'
      - 'template/**'
      - 'tests/test_static_api_11.py'
      - 'tests/fixtures/github/**'
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapp-work-static-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build through the one root build
        run: python3 -B build.py
      - name: Refuse stale generated artifacts
        run: |
          git diff --exit-code -- \
            api/rapp-work/v1 \
            api/v1 \
            registry.json \
            llms.txt \
            sitemap.xml \
            .well-known
      - name: Check RAPP Work contracts and integrity
        run: python3 -B scripts/check_rapp_work_api.py
      - name: Run RAPP Work tests
        run: python3 -B -m unittest discover -s tests -p 'test_rapp_work_api.py'
      - name: Run rapp-static-api/1.1 tests (harvester, browser lint, client)
        run: python3 -B -m unittest discover -s tests -p 'test_static_api_11.py'
      - name: Run root conformance checker (ends with the 1.1 browser lint; fails on a lint error)
        run: python3 -B check.py
