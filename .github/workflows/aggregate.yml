name: Aggregate the estate

# Daily, plus on demand. Generation and every proof finish before the remote
# snapshot branch is touched. Publication then advances one deterministic
# branch without force and opens or refreshes a pull request to main.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: estate-snapshot-publication
  cancel-in-progress: false

# Temporary branch-only recapture: retain every hardened generation and proof
# step, but publish the resulting commit back to this disposable branch with
# GITHUB_TOKEN so the protected workflow can be restored before PR publication.
permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Refuse without the gate rules
        env:
          RAPP_GATE_RULES: ${{ secrets.GATE_RULES }}
        # The gate fails closed on its own, but say so here too: a missing
        # secret should read as a deliberate stop in the log, not as a
        # traceback someone has to interpret at 2am.
        # Set with: gh secret set GATE_RULES -R kody-w/rapp-monorepo
        run: |
          if [ -z "${RAPP_GATE_RULES}" ]; then
            echo "::error::GATE_RULES secret is not set. Refusing to aggregate"
            echo "::error::unscreened content into a public mirror."
            exit 1
          fi
          python3 -c "import ip_gate; ip_gate.assert_configured(); print('gate configured')"

      - name: Prove the gate still fires
        # The gate is the only thing between an upstream mistake and a second
        # public home for it. Prove it works BEFORE using it, every run - a
        # guard nobody has watched fail is indistinguishable from one that
        # cannot fail.
        run: python3 prove_gate.py

      - name: Prove capture boundaries
        # A repository-controlled symlink must stay a symlink. Dereferencing
        # it could copy a runner file into the public snapshot, while a failed
        # clone must not leave stale content that is absent from the manifest.
        run: |
          python3 prove_aggregate.py
          python3 prove_snapshot.py

      - name: Capture every public RAPP repo
        env:
          RAPP_GATE_RULES: ${{ secrets.GATE_RULES }}
          GH_TOKEN: ${{ github.token }}
        run: python3 aggregate.py

      - name: Report organism architecture alignment
        run: |
          python -m pip install --disable-pip-version-check .
          ALIGNMENT_REPORT="$RUNNER_TEMP/rapp-alignment.json"
          if ! python -m rapp_sdk --root . --json alignment \
            > "$ALIGNMENT_REPORT"; then
            cat "$ALIGNMENT_REPORT"
            echo "::warning::Alignment report is unavailable for this newly captured tree."
            exit 0
          fi
          python - "$ALIGNMENT_REPORT" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          drift = report["taxonomy_drift"]
          if drift["manifest_only"] or drift["taxonomy_only"]:
              print(
                  "::warning::Organism taxonomy drift: "
                  f"manifest_only={drift['manifest_only']}, "
                  f"taxonomy_only={drift['taxonomy_only']}"
              )
          for projection in report["projections"]:
              checks = projection["daily_checks"]
              if not checks["captured_commit_matches_manifest"]:
                  print(
                      f"::warning::{projection['id']} projection pin differs "
                      "from the captured organ commit"
                  )
              if not checks["generator_provenance_paths_present"]:
                  print(
                      f"::warning::{projection['id']} projection provenance "
                      "paths are missing"
                  )
              if (
                  checks["generator_derivation_check"]
                  != "not-performed-captured-code-is-never-executed"
              ):
                  print(
                      f"::warning::{projection['id']} projection derivation "
                      "state is unexpected"
                  )
              if projection["freshness"]["state"] in {"stale", "unknown"}:
                  print(
                      f"::warning::{projection['id']} projection freshness is "
                      f"{projection['freshness']['state']}"
                  )
          PY

      - name: Refuse a snapshot nobody can download
        # The promise is "one clone and you have everything". A mirror that
        # quietly grows past what someone will actually download has broken
        # that promise without anyone noticing, so the size is a gate rather
        # than a statistic.
        run: |
          MB=$(du -sm repos | cut -f1)
          echo "snapshot is ${MB}MB"
          if [ "$MB" -gt 1500 ]; then
            echo "::error::Snapshot is ${MB}MB, past the 1500MB ceiling."
            echo "::error::Lower --max-file-mb or narrow membership before shipping."
            exit 1
          fi
          if [ "$MB" -gt 900 ]; then
            echo "::warning::Snapshot is ${MB}MB and heading for the ceiling."
          fi

      - name: Prepare the snapshot commit
        id: snapshot
        run: |
          git config user.name  "rapp-monorepo"
          git config user.email "noreply@github.com"
          # Raw-stage only publishable outputs so copied .gitignore files
          # cannot hide upstream-tracked files. The verifier also bypasses
          # copied clean filters while staging and proves the resulting index.
          python3 verify_snapshot.py --stage
          if git diff --cached --quiet; then
            echo "estate unchanged since the last snapshot"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPTURED=$(python3 -c "import json;d=json.load(open('MANIFEST.json'));print(len(d['repos']))")
          MISSED=$(python3 -c "import json;d=json.load(open('MANIFEST.json'));print(len(d['not_captured']))")
          git commit -m "Snapshot: ${CAPTURED} repos captured, ${MISSED} not captured"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the proved snapshot to this disposable branch
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          test "${GITHUB_REF}" = \
            "refs/heads/automation/one-time-hardened-recapture-20260823"
          git push origin "HEAD:${GITHUB_REF}"
